<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDo・カレンダー・時計</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1f2430; --muted: #7a8194;
    --accent: #3b6ef5; --line: #e4e6ec; --today: #e8efff; --danger: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --card:#1e212a; --text:#e8eaf0; --muted:#8b92a5; --accent:#6c93ff; --line:#2c303b; --today:#26325a; --danger:#ef7773; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  .card { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .clock { grid-column:1 / -1; text-align:center; }
  #time { font-size:3rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  #date { color:var(--muted); margin-top:4px; }
  h2 { margin:0 0 12px; font-size:1.1rem; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-head h2 { margin:0; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:4px 10px; }
  button:hover { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .dow { color:var(--muted); font-size:.8rem; padding:4px 0; }
  .day { position:relative; padding:8px 0; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .day:hover { background:var(--bg); }
  .day.other { color:var(--muted); opacity:.45; }
  .day.today { background:var(--today); font-weight:700; }
  .day.sel { border-color:var(--accent); }
  .day.sun { color:var(--danger); }
  .day .dot { position:absolute; left:50%; bottom:2px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--accent); }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input[type=text] { flex:1; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); min-width:0; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  li span { flex:1; word-break:break-all; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li button { border:none; color:var(--muted); padding:2px 6px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .empty { color:var(--muted); padding:12px 0; }
  @media (max-width:700px) { .wrap { grid-template-columns:1fr; } #time { font-size:2.4rem; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="card clock">
    <div id="time">--:--:--</div>
    <div id="date"></div>
  </section>

  <section class="card">
    <div class="cal-head">
      <button id="prev" aria-label="前の月">◀</button>
      <h2 id="month"></h2>
      <button id="next" aria-label="次の月">▶</button>
    </div>
    <div class="grid" id="cal"></div>
    <div style="text-align:right;margin-top:8px"><button id="goToday">今日</button></div>
  </section>

  <section class="card">
    <h2 id="todoTitle">ToDo</h2>
    <form id="form">
      <input type="text" id="input" placeholder="やることを入力" autocomplete="off" required>
      <button class="primary">追加</button>
    </form>
    <div class="tabs">
      <button data-f="day" class="on">選択日</button>
      <button data-f="all">すべて</button>
    </div>
    <ul id="list"></ul>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const DOW = ['日','月','火','水','木','金','土'];
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  // --- 時計 ---
  function tick() {
    const n = new Date();
    $('time').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    $('date').textContent = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日(${DOW[n.getDay()]})`;
  }
  tick(); setInterval(tick, 1000);

  // --- ToDo (localStorage) ---
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos') || '[]'); } catch {}
  const save = () => { try { localStorage.setItem('todos', JSON.stringify(todos)); } catch {} };

  let sel = new Date();
  let view = new Date(sel.getFullYear(), sel.getMonth(), 1);
  let filter = 'day';

  function renderCal() {
    $('month').textContent = `${view.getFullYear()}年${view.getMonth()+1}月`;
    const cal = $('cal');
    cal.innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
    const start = new Date(view.getFullYear(), view.getMonth(), 1 - view.getDay());
    const todayK = key(new Date()), selK = key(sel);
    const withTodo = new Set(todos.filter(t => !t.done).map(t => t.date));
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const k = key(d);
      const el = document.createElement('div');
      el.className = 'day' + (d.getMonth() !== view.getMonth() ? ' other' : '')
        + (k === todayK ? ' today' : '') + (k === selK ? ' sel' : '') + (d.getDay() === 0 ? ' sun' : '');
      el.textContent = d.getDate();
      if (withTodo.has(k)) el.insertAdjacentHTML('beforeend', '<i class="dot"></i>');
      el.onclick = () => { sel = d; view = new Date(d.getFullYear(), d.getMonth(), 1); render(); };
      cal.appendChild(el);
    }
  }

  function renderList() {
    const k = key(sel);
    $('todoTitle').textContent = filter === 'day' ? `ToDo(${sel.getMonth()+1}/${sel.getDate()})` : 'ToDo(すべて)';
    const items = todos.filter(t => filter === 'all' || t.date === k);
    const ul = $('list');
    ul.innerHTML = items.length ? '' : '<div class="empty">ToDoはありません</div>';
    items.forEach(t => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      const span = document.createElement('span');
      span.textContent = (filter === 'all' ? `[${t.date.slice(5).replace('-','/')}] ` : '') + t.text;
      const del = document.createElement('button');
      del.textContent = '✕'; del.setAttribute('aria-label', '削除');
      del.onclick = () => { todos = todos.filter(x => x !== t); save(); render(); };
      li.append(cb, span, del);
      ul.appendChild(li);
    });
  }

  function render() { renderCal(); renderList(); }

  $('form').onsubmit = e => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, date: key(sel), done: false });
    $('input').value = '';
    save(); render();
  };
  $('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); };
  $('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); };
  $('goToday').onclick = () => { sel = new Date(); view = new Date(sel.getFullYear(), sel.getMonth(), 1); render(); };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    renderList();
  });

  render();
})();
</script>
</body>
</html>
